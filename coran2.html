<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تعلم القرآن الكريم</title>
    <!-- Import Lateef and Arabic fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- mb.miniAudioPlayer CSS -->
    <link rel="stylesheet" type="text/css" href="css/jquery.mb.miniAudioPlayer.css" title="style" media="screen"/>
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.js"></script>
    <!-- mb.miniAudioPlayer Plugin -->
    <script type="text/javascript" src="jquery.mb.miniAudioPlayer.js"></script>
    <script type="text/javascript">
        $(function(){
            $(".audio-player").mb_miniPlayer();
        });
    </script>
    <style>
        /* Global Styles with Lateef font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lateef', 'Amiri', serif;
        }
        
        body {
            min-height: 100vh;
            position: relative;
            padding-bottom: 50px;
            background: linear-gradient(135deg, #0f4c3a 0%, #2d5a3d 50%, #1a472a 100%);
            color: #f5f5dc;
            direction: rtl;
        }
        
        /* Navigation Styles */
        nav {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #d4af37;
            padding: 0.8rem;
        }
        
        #dynamic-menus {
            list-style: none;
            display: flex;
            justify-content: center;
        }
        
        #dynamic-menus li {
            margin: 0 15px;
        }
        
        #dynamic-menus a {
            color: #f5f5dc;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 2px solid transparent;
        }
        
        #dynamic-menus a:hover,
        #dynamic-menus a.active {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            color: #d4af37;
            transform: translateY(-2px);
        }
        
        /* Content Styles */
        #content {
            padding: 15px;
            text-align: center;
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .surah-content {
            max-width: 700px;
            margin: 0 auto;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .surah-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #f4e67c, #d4af37);
        }
        
        .surah-title {
            font-size: 1.8rem;
            color: #d4af37;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .bismillah {
            font-size: 1.2rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 1rem;
            font-style: italic;
            opacity: 0.9;
        }
        
        .arabic-text {
            font-size: 1.6rem;
            line-height: 1.8;
            color: #f5f5dc;
            text-align: justify;
            margin-bottom: 1rem;
            font-family: 'Lateef', serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            text-justify: inter-word;
        }
        
        .verse-number {
            display: inline-block;
            background: #d4af37;
            color: #0f4c3a;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            margin: 0 5px;
            font-size: 0.9rem;
        }
        
        .description {
            font-size: 1rem;
            line-height: 1.5;
            opacity: 0.8;
            margin-top: 1rem;
        }
        
        /* Footer Styles */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            color: #f5f5dc;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #d4af37;
        }
        
        .decorative-border {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 1rem 0;
        }
        
        .audio-link {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }
        
        @media (max-width: 768px) {
            .surah-title {
                font-size: 2rem;
            }
            
            .arabic-text {
                font-size: 1.8rem;
            }
            
            #dynamic-menus {
                flex-direction: column;
                align-items: center;
            }
            
            #dynamic-menus li {
                margin: 5px 0;
            }
            
            .audio-link {
                width: 100%;
                display: flex;
                justify-content: center;
                overflow: hidden;
            }
            
            .audio-player {
                width: 100% !important;
                max-width: 280px !important;
                min-width: 200px !important;
                height: 36px !important;
            }
        }
        
        @media (max-width: 480px) {
            .audio-player {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 180px !important;
                height: 32px !important;
                font-size: 14px !important;
            }
            
            .audio-link {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul id="dynamic-menus"></ul>
    </nav>
    
    <div id="content"></div>
    
    <footer>
        <p>&copy; ٢٠٢٤ منصة تعلم القرآن الكريم - للاستخدام التعليمي</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            const contentDiv = document.getElementById('content');
            const dynamicMenu = document.getElementById('dynamic-menus');
            
            // Define pages content with the three Surahs
            const pages = {
falaq: `
                    <div class="surah-content">
                        <h1 class="surah-title">سورة الفلق</h1>
                        <div class="bismillah">بسم الله الرحمن الرحيم</div>
                        <div class="arabic-text">
                            قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ <span class="verse-number">١</span> مِن شَرِّ مَا خَلَقَ <span class="verse-number">٢</span> وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ <span class="verse-number">٣</span> وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ <span class="verse-number">٤</span> وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ <span class="verse-number">٥</span>
                        </div>
                        <p class="audio-link"><a class="audio-player {skin:'orange', autoPlay:false, width: 240, height: 40}" href="elfalek.mp3">استمع للتلاوة</a></p>
                        <div class="decorative-border"></div>
                        <p class="description">سورة الفلق هي السورة الثالثة عشرة بعد بالمائة في ترتيب المصحف الشريف، وهي من المعوذتين التي يُستعاذ بهما من الشرور.</p>
                    </div>
                `,
                nas: `
                    <div class="surah-content">
                        <h1 class="surah-title">سورة الناس</h1>
                        <div class="bismillah">بسم الله الرحمن الرحيم</div>
                        <div class="arabic-text">
                            قُلْ أَعُوذُ بِرَبِّ النَّاسِ <span class="verse-number">١</span> مَلِكِ النَّاسِ <span class="verse-number">٢</span> إِلَٰهِ النَّاسِ <span class="verse-number">٣</span> مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ <span class="verse-number">٤</span> الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ <span class="verse-number">٥</span> مِنَ الْجِنَّةِ وَالنَّاسِ <span class="verse-number">٦</span>
                        </div>
                        <p class="audio-link"><a class="audio-player {skin:'orange', autoPlay:false, width: 240, height: 40}" href="elfalek.mp3">استمع للتلاوة</a></p>
                        <div class="decorative-border"></div>
                        <p class="description">سورة الناس هي السورة الأخيرة في المصحف الشريف، وهي المعوذة الثانية التي تعلمنا الاستعاذة بالله من شر الوساوس.</p>
                    </div>
                `,
                ikhlas: `
                    <div class="surah-content">
                        <h1 class="surah-title">سورة الإخلاص</h1>
                        <div class="bismillah">بسم الله الرحمن الرحيم</div>
                        <div class="arabic-text">
                            قُلْ هُوَ اللَّهُ أَحَدٌ <span class="verse-number">١</span> اللَّهُ الصَّمَدُ <span class="verse-number">٢</span> لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="verse-number">٣</span> وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ <span class="verse-number">٤</span>
                        </div>
                        <p class="audio-link"><a class="audio-player {skin:'orange', autoPlay:false, width: 240, height: 40}" href="elfalek.mp3">استمع للتلاوة</a></p>
                        <div class="decorative-border"></div>
                        <p class="description">سورة الإخلاص تعادل ثلث القرآن، وهي تبين لنا وحدانية الله سبحانه وتعالى وأنه لا شريك له.</p>
                    </div>
                `
            };
            
            // Arabic menu names
            const menuNames = {
                falaq: 'سورة الفلق',
                nas: 'سورة الناس', 
                ikhlas: 'سورة الإخلاص'
            };
            
            // Create navigation menu
            let i = 0;
            for (let key in pages) {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${key}" class="${i === 0 ? 'active' : ''}">${menuNames[key]}</a>`;
                dynamicMenu.appendChild(li);
                i++;
            }
            
            // Function to load page content
            function loadPage(hash) {
                let page = hash.replace('#', '');
                
                // If no hash or invalid page, default to falaq
                if (!page || !pages[page]) {
                    page = 'falaq';
                    window.location.hash = 'falaq';
                }
                
                // Update content
                contentDiv.innerHTML = pages[page];
                
                // Initialize audio player for new content
                $(".audio-player").mb_miniPlayer();
                
                // Update active link
                setActiveLink(page);
            }
            
            // Function to set active navigation link
            function setActiveLink(page) {
                const links = document.querySelectorAll('nav a');
                
                links.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${page}`) {
                        link.classList.add('active');
                    }
                });
            }
            
            // Load page based on current hash
            loadPage(window.location.hash);
            
            // Handle hash changes
            window.addEventListener('hashchange', function() {
                loadPage(window.location.hash);
            });
        });
    </script>
</body>
</html>
